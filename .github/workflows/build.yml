name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project if uploaded as zip
        run: |
          for z in *.zip; do
            if [ -f "$z" ]; then
              echo "Membuka $z"
              unzip -o -q "$z" -d _proj
            fi
          done
          true

      - name: Locate project
        id: loc
        run: |
          f=$(find . -name settings.gradle.kts -not -path './.git/*' | head -n1)
          if [ -z "$f" ]; then
            echo "settings.gradle.kts tidak ditemukan"
            ls -R | head -50
            exit 1
          fi
          echo "dir=$(dirname "$f")" >> "$GITHUB_OUTPUT"
          echo "Proyek ditemukan di: $(dirname "$f")"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build debug APK
        working-directory: ${{ steps.loc.outputs.dir }}
        run: |
          for i in 1 2 3 4; do
            gradle assembleDebug --no-daemon && exit 0
            echo "Percobaan $i gagal, menunggu lalu mengulang..."
            sleep $((i * 45))
          done
          exit 1

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: ${{ steps.loc.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk
